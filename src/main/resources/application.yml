spring:
  application:
    name: change-assurance-agent
  datasource:
    url: jdbc:h2:mem:changeassurance;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  # ChatGPT is wired manually in ChangeAssuranceConfiguration; disable Spring AI auto-chat.
  ai:
    model:
      chat: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${CHANGEASSURANCE_AI_MODEL:gpt-4o-mini}

server:
  servlet:
    context-path: /
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

changeassurance:
  ai:
    # spring-ai | openai | chatgpt → ChatGPT via OPENAI_API_KEY
    # fake → stub responses; disabled → AI off (deterministic fallback)
    mode: ${CHANGEASSURANCE_AI_MODE:spring-ai}
    spring-ai-enabled: ${CHANGEASSURANCE_AI_SPRING_AI_ENABLED:true}
    model: ${CHANGEASSURANCE_AI_MODEL:gpt-4o-mini}
  storage:
    root: ./uploads
    max-bytes: 1048576

logging:
  level:
    root: INFO
    com.company.changeassurance: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} cid=%X{correlationId} - %msg%n"
