<section class="page">
  <header>
    <h1>Review history</h1>
    <a mat-flat-button color="primary" routerLink="/">New review</a>
  </header>
  <table mat-table [dataSource]="facade.history()" class="mat-elevation-z1">
    <ng-container matColumnDef="reviewId"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let row">{{ row.reviewId }}</td></ng-container>
    <ng-container matColumnDef="applicationName"><th mat-header-cell *matHeaderCellDef>Application</th><td mat-cell *matCellDef="let row">{{ row.applicationName }}</td></ng-container>
    <ng-container matColumnDef="changeTitle"><th mat-header-cell *matHeaderCellDef>Title</th><td mat-cell *matCellDef="let row">{{ row.changeTitle }}</td></ng-container>
    <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let row">{{ row.status }}</td></ng-container>
    <ng-container matColumnDef="riskLevel"><th mat-header-cell *matHeaderCellDef>Risk</th><td mat-cell *matCellDef="let row">{{ row.riskLevel }}</td></ng-container>
    <ng-container matColumnDef="recommendation"><th mat-header-cell *matHeaderCellDef>Recommendation</th><td mat-cell *matCellDef="let row">{{ row.recommendation }}</td></ng-container>
    <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let row"><a [routerLink]="['/reviews', row.reviewId]">Open</a></td></ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</section>
