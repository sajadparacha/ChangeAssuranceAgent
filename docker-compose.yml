services:
  change-assurance-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHANGEASSURANCE_AI_MODE: ${CHANGEASSURANCE_AI_MODE:-spring-ai}
      CHANGEASSURANCE_AI_SPRING_AI_ENABLED: ${CHANGEASSURANCE_AI_SPRING_AI_ENABLED:-true}
      CHANGEASSURANCE_AI_MODEL: ${CHANGEASSURANCE_AI_MODEL:-}
      CHANGEASSURANCE_AI_BASE_URL: ${CHANGEASSURANCE_AI_BASE_URL:-}
      CHANGEASSURANCE_STORAGE_ROOT: /app/uploads
      # For Ollama on the Docker host: CHANGEASSURANCE_AI_MODE=ollama and
      # CHANGEASSURANCE_AI_BASE_URL=http://host.docker.internal:11434/v1
    volumes:
      - caa-uploads:/app/uploads
volumes:
  caa-uploads:
